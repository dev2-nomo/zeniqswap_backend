name: Backend CI/CD

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          cache: true
      - run: git submodule update --init --recursive
      - run: flutter pub get
      - run: flutter analyze

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.HOSTLIQ }} >> ~/.ssh/known_hosts
          ssh-keyscan -H ${{ secrets.HOSTDEX }} >> ~/.ssh/known_hosts

      - name: Deploy to servers
        run: |
          # Function to deploy to a server
          deploy_to_server() {
            local server_name=$1
            local host=$2
            
            echo "🚀 Deploying to $server_name ($host)..."
            
            # Sync code to server
            rsync -avz --delete --exclude='.git' --exclude='.github' \
              ./ ${{ secrets.USERNAME }}@$host:zeniqswap_backend/
            
            # Deploy on server
            ssh -i ~/.ssh/id_ed25519 ${{ secrets.USERNAME }}@$host "
              cd zeniqswap_backend
              
              # Stop and cleanup old deployment
              sudo systemctl stop zeniqswap-backend.service || true
              docker stop zeniqswap_backend || true
              docker rm -f zeniqswap_backend || true
              
              # Build and start new deployment
              docker build -t zeniqswap_backend .
              sudo systemctl start zeniqswap-backend.service
              
              # Wait and verify
              sleep 10
              if ! systemctl is-active --quiet zeniqswap-backend.service; then
                echo '❌ Deployment failed on $server_name'
                journalctl -u zeniqswap-backend.service -n 20 --no-pager
                exit 1
              fi
              echo '✅ Deployment successful on $server_name'
            "
          }
          
          # Deploy to both servers
          deploy_to_server "LIQ" "${{ secrets.HOSTLIQ }}"
          deploy_to_server "DEX" "${{ secrets.HOSTDEX }}"
